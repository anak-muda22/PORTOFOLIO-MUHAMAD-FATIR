name: Update certificates.json
on:
  push:
    branches: [main]
    paths: ['public/certificates/**']
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/generate-certificates.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/certificates.json
          git diff --staged --quiet || (git commit -m "chore: update certificates.json" && git push)
